name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Check that the tag matches the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for file in package.json; do
            test "$(node -p "require('./$file').version")" = "$version" || { echo "$file version differs from $version"; exit 1; }
          done
          grep -q "^version = \"$version\"" src-tauri/Cargo.toml || { echo "Cargo.toml version differs from $version"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version v$version"; exit 1
          fi

  bundle:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: pnpm tauri build
            artifacts: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundle: pnpm bundle:macos
            artifacts: src-tauri/target/release/bundle/dmg/*.dmg
          - os: macos-15-intel
            bundle: pnpm bundle:macos
            artifacts: src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-24.04
            bundle: pnpm bundle:linux
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - os: ubuntu-24.04-arm
            bundle: pnpm bundle:linux
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-lfs
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.12
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf xdg-utils libnss3 libfuse2
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/engine-archives
          key: engine-archives-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/manifests/*.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch:engines
        env:
          ENGINE_CACHE_DIR: ${{ runner.temp }}/engine-archives
      - name: Test every bundled engine
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --include-ignored
      - run: ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [version, bundle]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Just Convert ${{ needs.version.outputs.version }}" \
            --generate-notes
